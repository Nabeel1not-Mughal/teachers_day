<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Teachers' Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;600;700&family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#1b0b44;--violet:#5b2a9e;--pink:#ff4f9a;--gold:#ffd166;--orange:#ff9f43;--teal:#2ee6c5;--white:#ffffff;
  --accent:#ffd166;--accent2:#ff4f9a;--chalk:#ffffff;
  --display:'Lilita One','Trebuchet MS',system-ui,sans-serif;
  --body:'Outfit','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--plum);color:var(--white);font-family:var(--body);font-size:1.08rem;line-height:1.65;overflow-x:hidden}
body.locked{overflow:hidden;height:100svh}
[hidden]{display:none!important}
button{font-family:inherit}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
#progress{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:5px;width:100%;z-index:70;transform-origin:left;transform:scaleX(0);
  background:linear-gradient(90deg,var(--gold),var(--pink),var(--teal))}

/* ================= HERO ================= */
.hero{position:relative;min-height:100svh;overflow:hidden;isolation:isolate;
  background:linear-gradient(180deg,#14073a 0%,#4b2398 30%,#c2418f 58%,#ff7a6b 76%,#ffb86b 90%,#ffd98a 100%)}
.stars,.clouds{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:.2;animation:tw var(--d) ease-in-out var(--dl) infinite}
@keyframes tw{50%{opacity:1;transform:scale(1.7)}}
.cloud{position:absolute;left:-260px;width:180px;height:48px;border-radius:50px;background:rgba(255,255,255,.28);animation:drift var(--d) linear var(--dl) infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:70px;height:70px;left:26px;top:-34px}
.cloud::after{width:52px;height:52px;left:86px;top:-22px}
@keyframes drift{to{transform:translateX(calc(100vw + 560px))}}
.heroScene{position:absolute;left:0;right:0;bottom:0;height:clamp(230px,40vw,440px);z-index:1;pointer-events:none}
.heroScene svg{width:100%;height:100%;display:block}
.sunWrap{animation:sunUp 3.6s cubic-bezier(.2,.7,.2,1) .2s both}
@keyframes sunUp{from{transform:translateY(200px)}to{transform:none}}
.rays{transform-origin:720px 270px;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.win{fill:var(--gold);opacity:0;animation:winOn .8s ease forwards,flick 5s ease-in-out infinite alternate}
@keyframes winOn{to{opacity:.95}}
@keyframes flick{to{filter:brightness(.78)}}
.hand{transform-origin:720px 168px;animation:spin 24s linear infinite}

.bunting{position:absolute;left:0;right:0;top:0;height:150px;z-index:4;pointer-events:none}
.bunting svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.flag{position:absolute;top:0;width:42px;height:58px;margin-left:-21px;transform-origin:50% 0;
  clip-path:polygon(0 0,100% 0,50% 100%);display:grid;place-items:start center;padding-top:8px;font-size:15px;color:rgba(255,255,255,.9);
  animation:swing var(--sw) ease-in-out var(--dl) infinite alternate}
@keyframes swing{from{transform:translateY(var(--y)) rotate(calc(var(--r) - 7deg))}to{transform:translateY(var(--y)) rotate(calc(var(--r) + 7deg))}}

.balloons{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.balloon{position:absolute;bottom:-160px;left:var(--x);width:var(--w);height:calc(var(--w)*1.22);pointer-events:auto;cursor:pointer;
  animation:rise var(--d) linear var(--dl) infinite}
.balloon .b{position:absolute;inset:0;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 7%,transparent 8%),var(--c);
  box-shadow:inset -8px -10px 18px rgba(0,0,0,.2);animation:sway 3.4s ease-in-out infinite alternate;transform-origin:50% 120%}
.balloon .b::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-6px;border:6px solid transparent;border-bottom-color:var(--c);border-top:0;filter:brightness(.85)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:70px;background:rgba(255,255,255,.55);transform-origin:top;animation:sway 3.4s ease-in-out infinite alternate}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(calc(-100vh - 320px))}}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}

.birds svg{position:absolute;width:34px;left:-60px;z-index:2;animation:fly var(--d) linear var(--dl) infinite}
.birds svg path{transform-origin:50% 70%;animation:flap .5s ease-in-out infinite alternate}
@keyframes fly{to{transform:translate(calc(100vw + 140px),var(--dy))}}
@keyframes flap{to{transform:scaleY(.45)}}

.heroContent{position:relative;z-index:5;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;
  padding:clamp(120px,17vh,170px) 20px clamp(130px,26vh,300px);pointer-events:none}
.heroContent>*{pointer-events:auto}
.mega{margin:0;font-family:var(--display);font-weight:400;line-height:.98;letter-spacing:.01em;position:relative}
.mega .row{display:block}
.mega .l1{font-size:clamp(3.6rem,15vw,10rem)}
.mega .l2{font-size:clamp(2.6rem,10.5vw,7rem)}
.mega .ch{display:inline-block;animation:letterIn 1s cubic-bezier(.3,1.6,.5,1) calc(var(--i)*.07s + .5s) both,idle 3.2s ease-in-out calc(var(--i)*.11s + 2.6s) infinite}
@keyframes letterIn{from{transform:translateY(-160%) rotate(-20deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes idle{50%{transform:translateY(-8px)}}
.l1 .ch{color:#ffe27a;text-shadow:0 1px 0 #f5a623,0 2px 0 #e89200,0 3px 0 #d07d00,0 4px 0 #b86a00,0 5px 0 #9e5700,0 6px 0 #864800,0 16px 22px rgba(40,0,70,.5)}
.l2 .ch{color:#fff;text-shadow:0 1px 0 #ffb3d6,0 2px 0 #ff8cc0,0 3px 0 #f2609f,0 4px 0 #d9407f,0 5px 0 #b82b69,0 6px 0 #962056,0 16px 22px rgba(40,0,70,.5)}
.spark{position:absolute;color:#fff;animation:tw 2.2s ease-in-out infinite;text-shadow:0 0 12px #ffe27a}
.sub{margin:clamp(14px,2.4vh,26px) 0 0;font-size:clamp(1.05rem,2.6vw,1.4rem);font-weight:600;color:#fff;text-shadow:0 2px 14px rgba(40,0,70,.55);animation:fadeIn 1s 2.3s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.panel{margin-top:clamp(20px,4vh,40px);width:min(92vw,560px);padding:clamp(18px,3vw,26px);border-radius:28px;
  background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.42);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 24px 60px rgba(30,0,60,.35);animation:panelIn .9s cubic-bezier(.2,1.2,.3,1) 2.6s both}
@keyframes panelIn{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
.panel form{display:grid;gap:.9rem}
.panel label{font-weight:600;font-size:1.08rem}
.panel input{width:100%;font:inherit;font-size:1.35rem;font-weight:600;color:#fff;text-align:center;
  background:rgba(27,11,68,.55);border:2px solid rgba(255,255,255,.4);border-radius:16px;padding:.7rem 1rem;outline:none;transition:border-color .2s,box-shadow .2s}
.panel input::placeholder{color:rgba(255,255,255,.62)}
.panel input:focus{border-color:var(--gold);box-shadow:0 0 0 5px rgba(255,209,102,.28)}
.panel input.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.go{font:inherit;font-weight:700;font-size:1.15rem;color:#fff;cursor:pointer;border:0;border-radius:16px;padding:.8rem 1.4rem;
  background:linear-gradient(100deg,var(--pink),var(--orange));box-shadow:0 10px 26px rgba(255,79,154,.5);transition:transform .15s,box-shadow .2s}
.go:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 14px 34px rgba(255,79,154,.65)}
.go:active{transform:scale(.97)}
.btn2{font:inherit;font-weight:600;color:#fff;cursor:pointer;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.5);border-radius:14px;padding:.55rem 1.1rem;transition:background .2s,transform .15s}
.btn2:hover{background:rgba(255,255,255,.28)}
.btn2:active{transform:scale(.96)}
:is(.go,.btn2,.chip,.pill,.dua-btn):focus-visible,.panel input:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ask{display:grid;gap:.8rem;justify-items:center;margin-top:.9rem}
.ask:empty{display:none}
.ask p{margin:0;font-size:1.12rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.chip{font:inherit;color:#fff;cursor:pointer;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.45);border-radius:999px;padding:.25rem .95rem;transition:all .2s}
.chip:hover{background:var(--gold);color:var(--plum);border-color:var(--gold)}
.ask .row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;align-items:center}
.ask input.mini{font-size:1.05rem;width:min(70vw,250px);padding:.45rem .8rem}
.pop{animation:popIn .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}

.welcome{margin-top:clamp(18px,3vh,34px);display:grid;justify-items:center;gap:.5rem}
.welcome .kick{margin:0;font-weight:600;font-size:clamp(1.1rem,2.6vw,1.5rem);animation:fadeIn .8s .2s both}
.bigname{margin:0;font-family:var(--display);font-weight:400;line-height:1.08;font-size:clamp(2.6rem,9.5vw,6.4rem);
  background:linear-gradient(90deg,#fff,#ffe27a,#ff9ec9,#8ff3e0,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(110,20,90,.55)) drop-shadow(0 14px 18px rgba(40,0,70,.4));
  animation:wipe 1.4s cubic-bezier(.2,.8,.2,1) .3s both,shimmer 5s linear 1.7s infinite;padding:0 .1em}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 -5% 0 -5%)}}
@keyframes shimmer{to{background-position:300% 0}}
.welcome .role{margin:0;font-weight:600;font-size:clamp(1.05rem,2.4vw,1.35rem);opacity:.95;animation:fadeIn .8s 1.3s both}
.cue{margin-top:1.2rem;display:grid;justify-items:center;gap:.2rem;color:#fff;font-weight:600;animation:fadeIn .8s 2s both;background:none;border:0;cursor:pointer;font-size:1rem}
.cue i{width:22px;height:22px;border-right:4px solid #fff;border-bottom:4px solid #fff;transform:rotate(45deg);animation:bob 1.3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(9px) rotate(45deg)}}

/* ================= STORY ================= */
#story{position:relative;z-index:2}
[data-r]{opacity:0}
[data-r].in{opacity:1;animation:rUp .9s cubic-bezier(.2,.8,.2,1) var(--dl,0s) backwards}
[data-r=zoom].in{animation-name:rZoom}
[data-r=left].in{animation-name:rLeft}
[data-r=right].in{animation-name:rRight}
[data-r=flip].in{animation-name:rFlip}
@keyframes rUp{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes rZoom{from{opacity:0;transform:scale(.6) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes rLeft{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
@keyframes rRight{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
@keyframes rFlip{from{opacity:0;transform:perspective(700px) rotateX(-70deg)}to{opacity:1;transform:none}}
.words .w{display:inline-block;white-space:pre;opacity:0}
.words.in .w{animation:wIn .6s calc(var(--i)*.035s + .15s) both}
@keyframes wIn{from{opacity:0;filter:blur(6px);transform:translateY(8px)}to{opacity:1;filter:none;transform:none}}

section.blk{position:relative;overflow:hidden;border-radius:48px 48px 0 0;margin-top:-48px;padding:clamp(70px,10vw,140px) clamp(20px,5vw,64px) clamp(80px,10vw,150px)}
.in-wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto}
h2.big{margin:0 0 .6em;font-family:var(--display);font-weight:400;font-size:clamp(2.1rem,6vw,4rem);line-height:1.08}

/* subject scenes */
.scene{color:#fff}
.glyphs{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.glyphs span{position:absolute;left:var(--x);top:105%;font-size:var(--s);color:var(--col);opacity:var(--o);white-space:nowrap;font-family:var(--gf);animation:gUp var(--d) linear var(--dl) infinite}
.m-fall .glyphs span{top:-12%;animation-name:gDown}
.m-float .glyphs span{top:var(--y);animation-name:gFloat;animation-timing-function:ease-in-out;animation-direction:alternate}
@keyframes gUp{to{top:-14%}}
@keyframes gDown{to{top:108%}}
@keyframes gFloat{from{transform:translate(0,0) rotate(-6deg)}to{transform:translate(26px,-34px) rotate(8deg)}}
.si{display:grid;grid-template-columns:minmax(200px,340px) 1fr;gap:clamp(24px,5vw,64px);align-items:center}
.scene .emb{width:100%;filter:drop-shadow(0 18px 40px rgba(0,0,0,.35))}
.emb svg{width:100%;height:auto;display:block;overflow:visible}
.emb text{font-family:var(--body)}
.ink{fill:none;stroke:var(--chalk);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.8s .2s ease forwards;animation-play-state:paused}
.in .ink{animation-play-state:running}
@keyframes draw{to{stroke-dashoffset:0}}
.emb .sym{fill:var(--accent);font-size:22px;font-weight:700}
.emb .big{fill:var(--accent);font-size:62px;font-weight:700}
.emb .ar{font-family:'Amiri',serif!important;fill:var(--accent);font-size:25px}
.emb .ur{font-family:'Noto Nastaliq Urdu',serif!important;fill:var(--accent);font-size:50px}
.spin{transform-origin:100px 100px;animation:spin 28s linear infinite}
.spin.slow{animation-duration:60s}
.wave{animation:wave 3s linear infinite}
@keyframes wave{to{transform:translateX(-100px)}}
.bub{fill:none;stroke:#fff;stroke-width:2;animation:bub 3s ease-in infinite}
.bub.b2{animation-delay:.9s}.bub.b3{animation-delay:1.8s}
@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-85px);opacity:0}}
.pulse,.twinkle{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.35)}}
.drop{fill:var(--accent2);animation:dropA 2.6s ease-in infinite}
@keyframes dropA{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(130px);opacity:0}}
.term{background:#070d14;border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:12px 14px 16px;box-shadow:0 14px 44px rgba(0,0,0,.5)}
.term .dots{display:flex;gap:6px;margin-bottom:10px}
.term .dots i{width:10px;height:10px;border-radius:50%;background:#ff6b6b}
.term .dots i:nth-child(2){background:#ffd86b}.term .dots i:nth-child(3){background:#5cff8a}
.term pre{margin:0;min-height:8.4em;font:600 .84rem/1.55 ui-monospace,Menlo,Consolas,monospace;color:var(--accent);white-space:pre-wrap;word-break:break-word}

.tag{display:inline-block;margin:0 0 .9rem;padding:.2rem 1rem;border-radius:999px;background:var(--accent);color:#1b0b44;font-weight:700;font-size:.98rem}
.scene h2{margin:0 0 .5em;font-family:var(--display);font-weight:400;font-size:clamp(2rem,5.4vw,3.7rem);line-height:1.1}
.scene .msg{margin:0;font-size:clamp(1.05rem,2vw,1.25rem);max-width:60ch}
.scene .pun{margin:1.2rem 0 0;padding:.2rem 0 .2rem 1rem;border-left:5px solid var(--accent2);font-style:italic;opacity:.92}
.quote{margin:1.4rem 0 0;padding:1rem 1.2rem;border-radius:18px;background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.15)}
.quote q{display:block;quotes:none;font-family:'Amiri','Noto Nastaliq Urdu',serif;font-size:clamp(1.6rem,3.6vw,2.2rem);line-height:2;text-align:center}
.quote.urdu q{font-family:'Noto Nastaliq Urdu','Amiri',serif;line-height:2.5;font-size:clamp(1.15rem,2.8vw,1.6rem)}
.quote cite{display:block;text-align:center;font-size:.95rem;font-style:normal;opacity:.8}
.lessons{margin-top:clamp(36px,6vw,72px);display:grid;grid-template-columns:repeat(3,1fr);gap:18px;position:relative;z-index:2}
.lc{padding:1.3rem 1.3rem 1.4rem;border-radius:22px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .3s,background .3s}
.lc:hover{transform:translateY(-6px) rotate(-.6deg);background:rgba(255,255,255,.17)}
.lc .lic{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--accent);color:#1b0b44;font-size:1.3rem;margin-bottom:.7rem}
.lc p{margin:0;font-weight:600}

/* marquee */
section.marq{background:linear-gradient(100deg,#ffd166,#ff9f43 55%,#ff6b8b);color:var(--plum);padding:clamp(54px,8vw,100px) 0 clamp(70px,9vw,120px)}
.marq .lead{max-width:1080px;margin:0 auto clamp(26px,4vw,48px);padding:0 clamp(20px,5vw,64px)}
.marq .lead h2{margin:0}
.track{display:flex;width:max-content;gap:2.2rem;animation:mq 34s linear infinite;font-family:var(--display);font-size:clamp(3rem,10vw,7.4rem);line-height:1.15;white-space:nowrap}
.track.rev{animation-direction:reverse;animation-duration:42s}
.track span:nth-child(even){color:transparent;-webkit-text-stroke:2px var(--plum)}
@keyframes mq{to{transform:translateX(-50%)}}

/* stats */
.stats{background:linear-gradient(170deg,#2a0f6b,#1b0b44 70%)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.stat{padding:clamp(22px,3vw,34px);border-radius:26px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);text-align:center}
.stat .n{font-family:var(--display);font-size:clamp(3.2rem,8vw,5.4rem);line-height:1;background:linear-gradient(180deg,#ffe27a,#ff7ab5);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .inf{display:inline-block;animation:infspin 3s ease-in-out infinite}
@keyframes infspin{50%{transform:scale(1.18) rotate(-6deg)}}
.stat p{margin:.6rem 0 0}

/* journey */
.journey-sec{background:linear-gradient(180deg,#1b0b44,#2d1370 60%,#3b1a86)}
.journey{position:relative;max-width:920px;margin:0 auto}
.jline{position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;border-radius:6px;background:rgba(255,255,255,.14)}
.jline i{position:absolute;inset:0;border-radius:6px;background:linear-gradient(var(--gold),var(--pink));transform-origin:top;transform:scaleY(var(--p,0));box-shadow:0 0 20px rgba(255,209,102,.7)}
.lamp{position:absolute;left:50%;top:calc(var(--p,0)*100%);width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff7c2;box-shadow:0 0 0 8px rgba(255,209,102,.3),0 0 40px 10px rgba(255,209,102,.8)}
.ms{position:relative;width:50%;padding:0 54px 60px 0;text-align:right;opacity:.35;transform:scale(.96);transition:opacity .5s,transform .5s}
.ms:nth-of-type(even){margin-left:50%;padding:0 0 60px 54px;text-align:left}
.ms:last-child{padding-bottom:0}
.ms .dot{position:absolute;top:8px;right:-14px;width:28px;height:28px;border-radius:50%;background:#2d1370;border:3px solid rgba(255,255,255,.3);transition:all .5s}
.ms:nth-of-type(even) .dot{right:auto;left:-14px}
.ms.on{opacity:1;transform:none}
.ms.on .dot{background:var(--gold);border-color:#fff;box-shadow:0 0 0 8px rgba(255,209,102,.25),0 0 30px var(--gold)}
.ms h3{margin:0 0 .3rem;font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,3.4vw,2.2rem);color:var(--gold)}
.ms p{margin:0}

/* garden */
.garden-sec{background:linear-gradient(180deg,#7fd3ff 0%,#c4f0ff 55%,#dff9d2 100%);color:#12324a}
.garden-sec h2.big{color:#12324a}
.garden-sec .sunny{position:absolute;right:8%;top:60px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#fff7c2 30%,#ffd166 70%);box-shadow:0 0 0 18px rgba(255,255,255,.35),0 0 80px 20px rgba(255,209,102,.8);animation:pulse 4s ease-in-out infinite}
.gctl{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;margin-bottom:1.2rem}

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* "Dil se" line: link ke aakhir mein ?from=Naam laga kar badal sakte hain */
const FROM = (new URLSearchParams(location.search).get('from') || 'Muhammad Nabeel').trim().slice(0, 40);

/* ================= Teachers + name matching ================= */
//#MATCH_START
const TITLES = new Set(['sir','sr','miss','ms','mam','maam','madam','mrs','mr','sahab','sahib','sb','ustad','ustaad','ustani','teacher','mohtarma','mohtaram','respected','ji','jee','muhtaram','muhtarma']);
const TEACHERS = [
  {id:'raza', title:'Sir', name:'Ahmad Raza', groups:[['ahmad','ahmed','ahmd','احمد'],['raza','reza','razaa','ahmadraza','رضا']], subjects:[{key:'chem',label:'Chemistry'}]},
  {id:'ahsan', title:'Sir', name:'Ahsan', groups:[['ahsan','ehsan','ahsaan','ihsan','ahsn','احسن']], subjects:[{key:'math',label:'Mathematics'},{key:'physics',label:'Physics'}]},
  {id:'shafique', title:'Sir', name:'Shafique', groups:[['shafique','shafiq','shafeeq','shafik','shafeek','shafeeque','shfiq','شفیق']], subjects:[{key:'computer',label:'Computer'}]},
  {id:'hira', title:'Miss', name:'Hira', groups:[['hira','heera','hera','hirah','ہیرا']], subjects:[{key:'quran',label:'Tarjuma tul Quran'}]},
  {id:'amna', title:'Miss', name:'Amna', groups:[['amna','aamna','amina','aamina','amnah','آمنہ','امنہ']], subjects:[{key:'pak',label:'Pakistan Studies'}]},
  {id:'bilal', title:'Sir', name:'Bilal', groups:[['bilal','belal','bilaal','bilall','بلال']], subjects:[{key:'physics',label:'Physics'}]},
  {id:'sadaf', title:'Miss', name:'Sadaf', groups:[['sadaf','sadaaf','sadf','sadaff','صدف']], subjects:[{key:'urdu',label:'Urdu'}]},
];
const FEMALE=new Set('hira amna aamna sadaf ayesha aisha fatima fatimah sana saima nazia farah uzma rabia sidra bushra nida mehwish iqra kiran zainab maryam mariam sobia sumaira shazia nadia samina rukhsana tahira farzana naila asma khadija hina huma saba sumbal anum areeba laiba noor mahnoor bisma rida javeria afshan shumaila tayyaba shagufta nasreen parveen shaheen naheed ghazala rubina sehrish memona amina aliya alia sania sadia sadiya saira sumera zara madiha mahira komal hafsa mehreen lubna ambreen asia'.split(' '));
const MALE=new Set('ahmad ahmed ali hassan hasan hussain husnain usman umar omar imran kashif asif tariq naveed adeel waqas faisal bilal shafique shafiq ahsan raza zubair kamran nadeem saleem javed irfan rashid rizwan shahid sajid zahid arif farhan fahad hamza junaid khalid mubashir nabeel noman qasim saad salman shoaib talha waseem yasir zeeshan mohsin muhammad mohammad abdullah abdul kamal jamal danish daniel haider hammad ibrahim ismail yousaf yousuf zain zohaib atif aamir amir akram anwar asad ayub babar fawad ghulam haroon hashim iqbal jawad kaleem majid mansoor naeem owais rehan rafiq sohail sultan taimoor waqar wajid zafar'.split(' '));
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function normalize(raw){return raw.toLowerCase().replace(/[^\p{L}\s]/gu,' ').split(/\s+/).filter(w=>w&&!TITLES.has(w));}
function tokenScore(tok,forms){
  if(forms.includes(tok))return 2;
  const th=tok.length>=8?2:tok.length>=5?1:0;
  for(const f of forms){
    if(th&&Math.abs(f.length-tok.length)<=th&&lev(tok,f)<=th)return 1;
    if(tok.length>=3&&f.startsWith(tok))return 1;
  }
  return 0;
}
function matchTeacher(raw){
  const toks=normalize(raw);
  if(!toks.length)return {type:'empty'};
  const res=[];
  for(const t of TEACHERS){
    let score=0,matched=0,exact=0;const used=new Set();
    for(const tok of toks){
      let best=0,bi=-1;
      t.groups.forEach((g,gi)=>{if(used.has(gi))return;const s=tokenScore(tok,g);if(s>best){best=s;bi=gi;}});
      if(best){used.add(bi);score+=best;matched++;if(best===2)exact++;}
    }
    if(matched)res.push({t,score,matched,exact,unmatched:toks.length-matched});
  }
  res.sort((a,b)=>b.score-a.score);
  const clean=res.filter(r=>r.unmatched===0);
  if(clean.length){
    const top=clean[0],tie=clean.filter(r=>r.score===top.score);
    if(tie.length>1)return {type:'choose',list:tie.map(r=>r.t)};
    return top.exact===toks.length?{type:'known',t:top.t}:{type:'confirm',t:top.t};
  }
  if(res.length)return {type:'unknown',suggest:res[0].t};
  return {type:'unknown'};
}
function guessGender(raw){
  const all=raw.toLowerCase().replace(/[^\p{L}\s]/gu,' ').split(/\s+/).filter(Boolean);
  if(all.some(w=>['mam','maam','madam','miss','ms','mrs','mohtarma','muhtarma','ustani'].includes(w)))return 'Miss';
  if(all.some(w=>['sir','sahab','sahib','mr','ustad','ustaad'].includes(w)))return 'Sir';
  const toks=normalize(raw);
  if(toks.some(w=>FEMALE.has(w)))return 'Miss';
  if(toks.some(w=>MALE.has(w)))return 'Sir';
  return null;
}
function detectSubject(txt){
  const s=txt.toLowerCase();
  if(/chem|kimiya|کیمیا/.test(s))return 'chem';
  if(/math|riyaz|ریاضی|algebra|geometry|calculus/.test(s))return 'math';
  if(/phys|فزکس|طبیعیات/.test(s))return 'physics';
  if(/comp|\bit\b|\bict\b|\bcs\b|program|coding|کمپیوٹر/.test(s))return 'computer';
  if(/quran|tarjum|tajweed|nazra|قرآن|ترجمہ/.test(s))return 'quran';
  if(/islam|deen|seerat|دینیات|اسلامیات/.test(s))return 'islamiyat';
  if(/pak|پاکستان/.test(s))return 'pak';
  if(/urdu|adab|ghazal|اردو/.test(s))return 'urdu';
  if(/eng|grammar|literature|انگلش/.test(s))return 'english';
  if(/bio|botany|zoology|science|سائنس/.test(s))return 'bio';
  return 'generic';
}
//#MATCH_END

/* ================= Themes for subject scenes ================= */
const SYM='"Outfit","Segoe UI Symbol","Noto Sans Symbols 2",sans-serif';
const THEMES={
  generic:{accent:'#ffd166',accent2:'#ff4f9a',bg:['#3b1a86','#241056','#5a1f6e'],mode:'float',glyphs:['✎','A+','★','♥','✦','1+1','abc','♪'],colors:['#ffd166','#8fd3ff','#ffb3c1','#9ff0c6']},
  chem:{accent:'#7cf2c0',accent2:'#ffd166',bg:['#0f4a4a','#0a2a33','#16324a'],mode:'rise',glyphs:['H₂O','NaCl','CO₂','Au','C₆H₆','O₂','H⁺','pH','Fe','⬡','NH₃'],colors:['#7cf2c0','#8fd3ff','#ffd166']},
  math:{accent:'#ffd166',accent2:'#ff9ec9',bg:['#27407e','#141f4a','#4a2a6e'],mode:'fall',glyphs:['π','∑','∫','√','∞','x²','Δ','θ','±','÷','e','%','7','3'],colors:['#ffd166','#ff9ec9','#bcd0ff']},
  physics:{accent:'#8fd3ff',accent2:'#ffd166',bg:['#1c3a78','#0c1a40','#3a2a78'],mode:'float',glyphs:['E=mc²','F=ma','λ','ω','ħ','V=IR','Ω','ψ','v=u+at','Φ'],colors:['#8fd3ff','#c8b6ff','#ffd166']},
  computer:{accent:'#5cff8a',accent2:'#8fd3ff',bg:['#0f3a28','#07130e','#12304a'],mode:'fall',glyphs:'01{}<>/;=()[]$#&|'.split(''),colors:['#5cff8a','#8fd3ff'],font:'ui-monospace,Menlo,Consolas,monospace'},
  quran:{accent:'#f0d27a',accent2:'#7cf2c0',bg:['#14504a','#0a2a2c','#4a3c14'],mode:'float',glyphs:['✦','۞','❖','✧','ﷲ','عِلْم','۩'],colors:['#f0d27a','#f8ecc0','#7cf2c0'],font:'"Amiri",serif'},
  pak:{accent:'#9bf0b6',accent2:'#ffffff',bg:['#0f6b3c','#07391f','#1b5a3a'],mode:'float',glyphs:['☪','★','✦','☪','★'],colors:['#ffffff','#9bf0b6','#d6f8e1']},
  urdu:{accent:'#ff9fb2',accent2:'#ffd166',bg:['#5a2a6a','#2a1236','#6a3a2a'],mode:'rise',glyphs:'الف ب پ ت ٹ ج چ ح خ د ڈ ر ز س ش ک گ ل م ن و ہ ی ے'.split(' '),colors:['#ff9fb2','#ffd166','#e5c8ff'],font:'"Noto Nastaliq Urdu",serif'},
  english:{accent:'#ffb86b',accent2:'#8fd3ff',bg:['#6a4220','#2a1a0c','#2a3a6a'],mode:'fall',glyphs:'A B C D E F G H Q R S T Aa Zz ? ! & @'.split(' '),colors:['#ffb86b','#ffe0b0','#8fd3ff']},
  bio:{accent:'#9ff0c6',accent2:'#ff9ec9',bg:['#16603f','#0a2d2a','#5a2a5a'],mode:'rise',glyphs:['🧬','🌱','🔬','🦠','🌿','DNA','ATCG'],colors:['#9ff0c6','#ff9ec9','#ffd166']},
};
THEMES.islamiyat=THEMES.quran;

/* ================= Emblems ================= */
let typeTok=0;
function typeCode(name){
  const tok=++typeTok,el=$('#code');if(!el)return;
  const lines=['const ustaad = new Legend();','ustaad.teach(students);','while (bug) ustaad.help();','students.success++; // hamesha','console.log("Shukriya, '+name+'!");'];
  if(reduce){el.textContent=lines.join('\n');return;}
  let i=0,j=0;
  (function step(){
    if(tok!==typeTok||!el.isConnected)return;
    if(i>=lines.length)return;
    const L=lines[i];
    if(j<=L.length){el.textContent=lines.slice(0,i).join('\n')+(i?'\n':'')+L.slice(0,j)+'\u258C';j++;setTimeout(step,30);}
    else{i++;j=0;setTimeout(step,260);}

/* ================= FX canvas: fireworks, confetti, sparkles ================= */
const fx=$('#fx'),fctx=fx.getContext('2d');
let W=0,H=0;
const FX=[];
const PAL=['#ffd166','#ff4f9a','#2ee6c5','#8fd3ff','#ffffff','#ff9f43','#c8b6ff'];
const CONF=['#ffd166','#ff4f9a','#8fd3ff','#9ff0c6','#ffffff','#c8b6ff'];
function resize(){
  const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  fx.width=Math.round(W*d);fx.height=Math.round(H*d);fx.style.width=W+'px';fx.style.height=H+'px';
  fctx.setTransform(d,0,0,d,0,0);
  buildBunting();
}
function launch(x){FX.push({t:'rocket',x:x==null?rnd(W*.15,W*.85):x,y:H+10,vx:rnd(-.6,.6),vy:-rnd(10,14),ty:rnd(H*.12,H*.5),col:pick(PAL),life:0});}
function explode(x,y,col){
  const n=reduce?26:72,c2=pick(PAL);
  for(let i=0;i<n;i++){const a=Math.PI*2*i/n+rnd(-.05,.05),s=rnd(1.5,6.6);
    FX.push({t:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col:i%3?col:c2,life:0,max:rnd(50,95)});}
}
function show(n=3){for(let i=0;i<n;i++)setTimeout(()=>launch(),i*320);}
function burst(x,y,n=90){
  if(reduce)n=30;
  for(let i=0;i<n;i++){
    const a=rnd(-Math.PI,0)+rnd(-.5,.5),s=rnd(4,13),em=Math.random()<.28;
    FX.push({t:em?'emoji':'conf',ch:pick(['📚','✏️','⭐','🌹','🎉','💐','🌟','🌸']),col:pick(CONF),x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.22,rot:rnd(0,6),vr:rnd(-.25,.25),size:em?rnd(18,28):rnd(6,11),life:0,max:rnd(110,190)});
  }
}
function twinkle(x,y){FX.push({t:'star',x:x+rnd(-5,5),y:y+rnd(-5,5),vx:rnd(-.5,.5),vy:rnd(.2,1),col:pick(['#ffe27a','#fff','#ffb3d6']),size:rnd(3,7),life:0,max:rnd(26,44),rot:rnd(0,3)});}
function star(ctx,r){ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?r*.38:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fill();}
function drawFx(dt){
  fctx.clearRect(0,0,W,H);fctx.textAlign='center';fctx.textBaseline='middle';
  for(let i=FX.length-1;i>=0;i--){
    const p=FX[i];p.life+=dt;
    if(p.t==='rocket'){
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.12*dt;
      fctx.globalCompositeOperation='lighter';fctx.fillStyle=p.col;fctx.globalAlpha=.9;fctx.beginPath();fctx.arc(p.x,p.y,2.4,0,6.3);fctx.fill();
      if(Math.random()<.7)FX.push({t:'spark',x:p.x,y:p.y,vx:rnd(-.3,.3),vy:rnd(.3,1),col:'#ffd9a0',life:0,max:18,s:.5});
      fctx.globalCompositeOperation='source-over';fctx.globalAlpha=1;
      if(p.y<=p.ty||p.vy>-1){explode(p.x,p.y,p.col);FX.splice(i,1);}
      continue;
    }
    if(p.t==='spark'){
      p.vx*=.975;p.vy=p.vy*.975+.07*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.life>p.max){FX.splice(i,1);continue;}
      fctx.globalCompositeOperation='lighter';fctx.globalAlpha=1-p.life/p.max;fctx.strokeStyle=p.col;fctx.lineWidth=(p.s||1)*2.2;fctx.lineCap='round';
      fctx.beginPath();fctx.moveTo(p.x-p.vx*1.7,p.y-p.vy*1.7);fctx.lineTo(p.x,p.y);fctx.stroke();
      fctx.globalCompositeOperation='source-over';fctx.globalAlpha=1;continue;
    }
    if(p.t==='star'){
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=.05*dt;
      if(p.life>p.max){FX.splice(i,1);continue;}
      fctx.globalAlpha=1-p.life/p.max;fctx.fillStyle=p.col;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.rot);star(fctx,p.size);fctx.restore();fctx.globalAlpha=1;continue;
    }
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.vx*=.992;
    const fade=Math.min(1,(p.max-p.life)/30);
    if(p.life>p.max||p.y>H+60){FX.splice(i,1);continue;}
    fctx.globalAlpha=Math.max(0,fade);fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.rot);
    if(p.t==='conf'){fctx.fillStyle=p.col;fctx.fillRect(-p.size/2,-p.size/3,p.size,p.size*.6);}
    else{fctx.font=`${p.size}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;fctx.fillText(p.ch,0,0);}
    fctx.restore();
  }
  fctx.globalAlpha=1;
}

/* sound */
let ac;
function tone(freqs,step=.12,vol=.07,len=.9){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const now=ac.currentTime;
    freqs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),s=now+i*step;
      o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+len);
      o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+len+.1);});
  }catch(_){}
}

  });
  b.addEventListener('animationiteration',e=>{if(e.target===b){b.style.setProperty('--x',rnd(2,92).toFixed(1)+'%');}});
  holder.appendChild(b);
}
function buildBalloons(){const n=innerWidth<640?6:10;for(let i=0;i<n;i++)spawnBalloon(true);}

/* ================= Gate / ask flow ================= */
const form=$('#nameForm'),input=$('#nameInput'),ask=$('#ask'),panel=$('#panel'),story=$('#story');
function titleCase(s){return s.trim().replace(/\s+/g,' ').split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function btn(label,fn,cls='btn2'){const b=el('button',cls,label);b.type='button';b.addEventListener('click',fn);return b;}
function clearAsk(){ask.textContent='';}
function say(text){const p=el('p','pop',text);ask.appendChild(p);return p;}
function ctxFor(t){return {name:`${t.title} ${t.name}`,title:t.title,subjects:t.subjects,known:true};}

form.addEventListener('submit',e=>{
  e.preventDefault();
  const raw=input.value.trim();clearAsk();
  const r=matchTeacher(raw);
  if(r.type==='empty'){input.classList.remove('shake');void input.offsetWidth;input.classList.add('shake');input.focus();say('Pehle apna naam likhein, phir wish khulegi.');return;}
  if(r.type==='known')return go(ctxFor(r.t));
  const guess=r.type==='confirm'?r.t:(r.type==='unknown'&&r.suggest)?r.suggest:null;
  if(guess){
    say(`Kya aap ${guess.title} ${guess.name} hain?`);
    const row=el('div','row pop');
    row.appendChild(btn('Ji haan',()=>go(ctxFor(guess)),'go'));
    row.appendChild(btn('Nahi, koi aur hoon',()=>askSubject(raw)));
    ask.appendChild(row);return;
  }
  if(r.type==='choose'){
    say('Aap in mein se kaun hain?');
    const row=el('div','chips pop');
    r.list.forEach(t=>row.appendChild(btn(`${t.title} ${t.name}`,()=>go(ctxFor(t)),'chip')));
    ask.appendChild(row);return;
  }
  askSubject(raw);
});
function askSubject(raw,gender){
  clearAsk();
  const name=titleCase(normalize(raw).join(' '))||'Ustaad';
  gender=gender||guessGender(raw);
  if(!gender){
    say(`${name}, aap Sir hain ya Miss?`);
    const g=el('div','row pop');
    g.appendChild(btn('Sir',()=>askSubject(raw,'Sir'),'go'));
    g.appendChild(btn('Miss',()=>askSubject(raw,'Miss'),'go'));
    ask.appendChild(g);return;
  }
  say(`Khush amdeed, ${gender} ${name}! Aap kaun sa subject parhate hain?`);
  const chips=el('div','chips pop');
  ['Mathematics','Physics','Chemistry','Biology','Computer','English','Urdu','Islamiyat','Pakistan Studies','Tarjuma tul Quran'].forEach(s=>chips.appendChild(btn(s,()=>finishUnknown(name,s,gender),'chip')));
  ask.appendChild(chips);
  const row=el('div','row pop');
  const mini=document.createElement('input');mini.type='text';mini.className='mini';mini.placeholder='ya apna subject likhein';mini.maxLength=40;mini.setAttribute('aria-label','Subject ka naam');
  mini.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(mini.value.trim())finishUnknown(name,mini.value.trim(),gender);}});
  row.appendChild(mini);
  row.appendChild(btn('Wish banayein',()=>{if(mini.value.trim())finishUnknown(name,mini.value.trim(),gender);else mini.focus();},'go'));
  row.appendChild(btn('Subject chhor dein',()=>finishUnknown(name,'',gender)));
  ask.appendChild(row);
}
function finishUnknown(name,subj,gender){
  const key=subj?detectSubject(subj):'generic';
  const label=subj?titleCase(subj):'';
  go({name:`${gender} ${name}`,title:gender,subjects:[{key,label,custom:label}],known:false});
}

/* ================= Go: reveal the celebration ================= */
let busy=false;
function go(ctx){
  if(busy)return;busy=true;
  chime();show(4);burst(W/2,H*.45,110);
  $('#sub').textContent='Aap ke liye, dil se';
  panel.hidden=true;
  const welcome=$('#welcome');welcome.hidden=false;
  $('#bigname').textContent=ctx.name;
  const roleTxt=ctx.subjects.map(s=>s.label).filter(Boolean).join(' & ');
  $('#role').textContent=roleTxt?`${roleTxt} Teacher`:'Hamare muhtaram ustaad';
  buildStory(ctx);
  document.body.classList.remove('locked');
  setTimeout(()=>{show(3);},1500);
  setTimeout(()=>{story.firstElementChild&&story.firstElementChild.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});busy=false;},reduce?200:3600);
}
$('#cue').addEventListener('click',()=>{story.firstElementChild&&story.firstElementChild.scrollIntoView({behavior:'smooth',block:'start'});});

function restart(){
  window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
  setTimeout(()=>{
    typeTok++;stopFinale();
    story.hidden=true;story.textContent='';
    $('#welcome').hidden=true;panel.hidden=false;
    $('#sub').textContent="5 October, World Teachers' Day";
    clearAsk();input.value='';busy=false;
    document.body.classList.add('locked');window.scrollTo(0,0);
    input.focus({preventScroll:true});
  },reduce?50:900);
}

/* ================= Story builders ================= */
function words(text){return text.split(/\s+/).map((w,k)=>`<span class="w" style="--i:${k}">${w} </span>`).join('');}
function sceneHTML(c,s,idx){
  const th=THEMES[s.key]||THEMES.generic,N=esc(c.name);
  const w=(WISH[s.key]||WISH.generic)({N,S:esc(s.custom||'')});
  const ls=LESSONS[s.key]||LESSONS.generic;
  const gl=Array.from({length:24},()=>{const g=pick(th.glyphs);
    return `<span style="--x:${rnd(2,96).toFixed(1)}%;--y:${rnd(4,90).toFixed(1)}%;--s:${rnd(18,48).toFixed(0)}px;--d:${(th.mode==='fall'&&s.key==='computer'?rnd(7,13):rnd(14,28)).toFixed(1)}s;--dl:-${rnd(0,26).toFixed(1)}s;--col:${pick(th.colors)};--o:${rnd(.12,.36).toFixed(2)}">${esc(g)}</span>`;}).join('');
  const q=w.quote?`<blockquote class="quote${w.quote.urdu?' urdu':''}" dir="rtl" data-r="zoom" style="--dl:.3s"><q>${w.quote.text.split('\n').join('<br>')}</q><cite dir="ltr">${esc(w.quote.by)}</cite></blockquote>`:'';
  const label=s.label?`${esc(s.label)} ke liye`:'Aap ke liye';
  return `<section class="blk scene m-${th.mode}" data-key="${s.key}" style="--accent:${th.accent};--accent2:${th.accent2};--gf:${th.font||SYM};background:linear-gradient(165deg,${th.bg[0]},${th.bg[1]} 58%,${th.bg[2]});${idx===0?'':''}">
    <div class="glyphs" aria-hidden="true">${gl}</div>
    <div class="in-wrap">
      <div class="si">
        <div class="emb" aria-hidden="true" data-r="zoom">${(EMB[s.key]||EMB.generic)()}</div>
        <div>
          <span class="tag" data-r="left">${label}</span>
          <h2 data-r="up" style="--dl:.1s">${w.title}</h2>
          <p class="msg words">${words(w.msg)}</p>
          ${w.pun?`<p class="pun" data-r="right" style="--dl:.4s">${esc(w.pun)}</p>`:''}
          ${q}
        </div>
      </div>
      <div class="lessons">${ls.map((t,k)=>`<div class="lc" data-r="flip" style="--dl:${(k*.14).toFixed(2)}s"><span class="lic">✦</span><p>${esc(t)}</p></div>`).join('')}</div>
    </div>
  </section>`;
}
function marqueeHTML(){
  const items=['Shukriya','Thank You','شکریہ','Izzat','جزاک اللہ','Rehnumai','Ehsan','Dua'];
  const items2=['Sabr','Mehnat','Hausla','Ilm','شکریہ','Respect','Mohabbat','Roshni'];
  const row=a=>[...a,...a].map(x=>`<span>${x}</span>`).join('');
  return `<section class="blk marq" aria-label="Shukriya">
    <div class="lead"><h2 class="big" data-r="up">Ek lafz mein kitna kuch</h2></div>
    <div class="track" aria-hidden="true">${row(items)}</div>
    <div class="track rev" aria-hidden="true">${row(items2)}</div>
  </section>`;
}
function statsHTML(N){
  return `<section class="blk stats">
    <div class="in-wrap">
      <h2 class="big" data-r="up">${N} ke hisaab ka hisaab</h2>
      <div class="sgrid">
        <div class="stat" data-r="zoom"><div class="n"><span class="num" data-to="1000">0</span>+</div><p>dafa aap ne ek hi cheez pyaar se dobara samjhayi</p></div>
        <div class="stat" data-r="zoom" style="--dl:.15s"><div class="n"><span class="num" data-to="365">0</span></div><p>din ki mehnat, baghair kisi shikayat ke</p></div>
        <div class="stat" data-r="zoom" style="--dl:.3s"><div class="n"><span class="inf">∞</span></div><p>dua hamari taraf se, aap ke liye hamesha</p></div>
      </div>
    </div>
  </section>`;
}
function journeyHTML(N){
  const ms=[
    ['Pehla din',`Jab hum anjaan the, ${N} ne pehle hi din se hamein apna bana liya.`],
    ['Alif se Zay tak','Har sabaq itni mehnat se diya ke mushkil cheez bhi aasan lagne lagi.'],
    ['Daant mein bhi pyaar','Wo daant, wo tokna, sab hamare bhale ke liye tha. Aaj samajh aaya.'],
    ['Hausla',`Jab hum haar maanne lage, ${N} ne kaha: tum kar sakte ho. Aur hum ne kar dikhaya.`],
    ['Aaj',`Aaj hum jo kuch bhi hain, us ki buniyad ${N} ki mehnat hai.`],
  ];
  return `<section class="blk journey-sec">
    <div class="in-wrap">
      <h2 class="big" data-r="up">Ek ustaad ka safar, hamare saath</h2>
      <div class="journey" id="journey">
        <div class="jline"><i></i></div><div class="lamp"></div>
        ${ms.map(([h,t])=>`<article class="ms"><span class="dot"></span><h3>${h}</h3><p>${t}</p></article>`).join('')}
      </div>
    </div>
  </section>`;
}
function gardenHTML(N){
  return `<section class="blk garden-sec" id="gardenSec">
    <div class="sunny" aria-hidden="true"></div>
    <div class="in-wrap">
      <h2 class="big" data-r="up">${N} ke liye phoolon ka bagh</h2>
      <div class="gctl" data-r="up" style="--dl:.1s">
        <button class="pill" id="plantBtn" type="button">Phool pesh karein</button>
        <button class="pill alt" id="wowBtn" type="button">Phoolon ki barish</button>
        <span class="gcount" id="gcount" aria-live="polite"></span>
      </div>
      <p class="gnote" id="gnote">Button dabayen ya bagh mein kahin bhi tap karein, aur phool ugte dekhein.</p>
      <div class="garden" id="garden" aria-label="Phoolon ka bagh"><div class="ground"></div></div>
    </div>
  </section>`;
}
function duaHTML(){
  return `<section class="blk dua-sec">
    <div class="in-wrap">
      <h2 class="big" data-r="up">Aap ke liye ek dua</h2>
      <div class="scene3d" data-r="zoom"><div class="flipper" id="flipper">
        <div class="face a" id="faceA">Card palatne ke liye neeche button dabayen.</div>
        <div class="face b" id="faceB"></div>
      </div></div>
      <button class="dua-btn" id="duaBtn" type="button">Dua kholein</button>
    </div>
  </section>`;
}
function finaleHTML(N){
  return `<section class="blk finale" id="finale">
    <div class="stars" id="stars2" aria-hidden="true"></div>
    <div class="in-wrap">
      <p class="fbig" data-r="zoom">Shukriya</p>
      <p class="fname" data-r="up" style="--dl:.2s">${N}</p>
      <p class="ftext words">Aap ne hamein sirf parhaya nahi, insaan banna sikhaya. Aap ki mehnat, sabr aur dua ka hum kabhi haq ada nahi kar sakte. Allah aap ko sehat, izzat aur dher saari khushiyan de. Happy Teachers' Day!</p>
      <p class="from" data-r="up" style="--dl:.5s">Dil se, ${esc(FROM)}</p>
      <div class="factions" data-r="up" style="--dl:.7s">
        <button class="go" id="fwBtn" type="button">Aatishbazi dekhein</button>
        <button class="btn2" id="againBtn" type="button">Shuru se dekhein</button>
      </div>
    </div>
  </section>`;
}

/* ================= Story wiring ================= */
let ctxNow=null,io=null,fio=null,finaleTimer=null,gardenCount=0;
function buildStory(c){
  ctxNow=c;
  const N=esc(c.name);
  story.hidden=false;
  story.innerHTML=c.subjects.map((s,i)=>sceneHTML(c,s,i)).join('')+marqueeHTML()+statsHTML(N)+journeyHTML(N)+gardenHTML(N)+duaHTML()+finaleHTML(N);
  // finale stars
  const st=$('#stars2');
  for(let k=0;k<70;k++){const e=document.createElement('i');e.style.cssText=`left:${rnd(0,100).toFixed(1)}%;top:${rnd(0,100).toFixed(1)}%;--s:${rnd(1.5,3.6).toFixed(1)}px;--d:${rnd(2,5).toFixed(1)}s;--dl:-${rnd(0,5).toFixed(1)}s`;st.appendChild(e);}
  gardenCount=0;
  bindStory();
  observe();
  onScroll();
}
function observe(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting)return;
    const t=e.target;t.classList.add('in');io.unobserve(t);
    if(t.classList.contains('scene')&&t.dataset.key==='computer')typeCode(ctxNow.name);
    if(t.classList.contains('stat'))countUp(t);
  }),{threshold:.18,rootMargin:'0px 0px -6% 0px'});
  $$('[data-r],.words,.scene').forEach(n=>io.observe(n));
  if(fio)fio.disconnect();
  fio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)startFinale();else stopFinale();}),{threshold:.35});
  fio.observe($('#finale'));
}
function countUp(stat){
  const n=$('.num',stat);if(!n)return;
  const to=+n.dataset.to,t0=performance.now(),dur=reduce?10:1800;
  (function f(now){const p=clamp((now-t0)/dur,0,1),e=1-Math.pow(1-p,3);n.textContent=Math.round(to*e).toLocaleString();if(p<1)requestAnimationFrame(f);})(t0);
}
function startFinale(){if(finaleTimer)return;show(2);finaleTimer=setInterval(()=>{launch();if(Math.random()<.5)setTimeout(()=>launch(),250);},1500);}
function stopFinale(){clearInterval(finaleTimer);finaleTimer=null;}

function plant(xPct){
  const g=$('#garden');if(!g)return;
  const fl=$$('.fl',g);if(fl.length>=46)fl[0].remove();
  const f=document.createElement('div');f.className='fl';
  f.style.cssText=`left:${clamp(xPct,3,97).toFixed(1)}%;--h:${rnd(70,210).toFixed(0)}px;--sw:${rnd(2.2,4.6).toFixed(1)}s`;
  f.innerHTML=`<i class="stem"></i><b class="head">${pick(['🌹','🌸','🌷','💐','🌼','🌺','🪷','🌻'])}</b>`;
  g.appendChild(f);
  gardenCount++;
  $('#gcount').textContent=`Phool: ${gardenCount}`;
  const m=GARDEN_MSG[gardenCount];
  if(m){$('#gnote').textContent=m.replace('{N}',ctxNow.name);if(gardenCount>=12)burst(W/2,H*.5,50);}
}
function bindStory(){
  $('#plantBtn').addEventListener('click',()=>plant(rnd(5,95)));
  $('#wowBtn').addEventListener('click',()=>{for(let i=0;i<14;i++)setTimeout(()=>plant(rnd(4,96)),i*110);});
  $('#garden').addEventListener('pointerdown',e=>{const r=e.currentTarget.getBoundingClientRect();plant((e.clientX-r.left)/r.width*100);});
  // dua flip
  let rot=0,front='A';
  $('#duaBtn').addEventListener('click',()=>{
    const txt=pick(DUAS).replace('{N}',ctxNow.name);
    const next=front==='A'?$('#faceB'):$('#faceA');
    next.textContent=txt;
    rot+=180;$('#flipper').style.transform=`rotateY(${rot}deg)`;
    front=front==='A'?'B':'A';
    $('#duaBtn').textContent='Ek aur dua';
    tone([659.25,880],.1,.05,.5);
  });
  $('#fwBtn').addEventListener('click',()=>{chime();show(6);burst(W/2,H*.6,120);});
  $('#againBtn').addEventListener('click',restart);
}

/* ================= Scroll effects ================= */
let ticking=false;
function onScroll(){
  if(ticking)return;ticking=true;
  requestAnimationFrame(()=>{
    ticking=false;
    const sy=scrollY,max=document.documentElement.scrollHeight-innerHeight;
    $('#progress').style.transform=`scaleX(${max>0?clamp(sy/max,0,1):0})`;
    if(!reduce&&sy<innerHeight*1.3){
      $$('[data-par]').forEach(n=>{n.style.transform=`translateY(${(sy*parseFloat(n.dataset.par)).toFixed(1)}px)`;});
    }
    const j=$('#journey');
    if(j){
      const r=j.getBoundingClientRect(),p=clamp((innerHeight*.62-r.top)/r.height,0,1);
      j.style.setProperty('--p',p.toFixed(4));
      $$('.ms',j).forEach(m=>{const mr=m.getBoundingClientRect();m.classList.toggle('on',mr.top<innerHeight*.66);});
    }
  });
}
addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',onScroll);

/* ================= Boot ================= */
buildHero();
resize();
requestAnimationFrame(t=>{last=t;loop(t);});
setTimeout(()=>{if(!reduce&&innerWidth>700)input.focus({preventScroll:true});},3400);
setTimeout(()=>{if(panel.hidden)return;show(2);},1800);
})();
</script>
